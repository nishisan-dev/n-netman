# n-netman Multi-Overlay Configuration Example (v2)
#
# This example demonstrates configuring multiple VXLAN overlays
# with independent routing policies for each.
#
# Scenario:
#   - VNI 100: Production traffic via ens3
#   - VNI 200: Management traffic via ens4

version: 2

node:
  id: "example-node"
  hostname: "example-node"
  tags:
    - "example"
    - "multi-overlay"

overlays:
  # Production Overlay (VNI 100)
  # Uses head-end-replication (default) - FDB entries for each peer
  - vni: 100
    name: "vxlan-prod"
    dstport: 4789
    mtu: 1450
    learning: true
    bridge:
      name: "br-prod"
      ipv4: "10.100.0.1/24"
      # Free-form segment labels. routing.inject rules select bridges by tag.
      tags: ["it", "external"]
    underlay_interface: "ens3"
    # BUM (Broadcast, Unknown Unicast, Multicast) traffic handling
    bum:
      mode: "head-end-replication"  # Default, can be omitted
    routing:
      export:
        networks:
          - "172.16.10.0/24"
          - "2001:db8:10::/64"
        include_connected: true
        metric: 100
        # Communities attached to every exported route. inject rules filter on
        # these via route_tags.
        tags: ["it"]
      import:
        accept_all: false
        allow:
          - "172.16.0.0/16"
        deny:
          - "0.0.0.0/0"
        install:
          table: 100
          flush_on_peer_down: true
          route_lease_seconds: 30

  # Management Overlay (VNI 200)
  # Uses multicast mode - requires multicast-enabled underlay
  - vni: 200
    name: "vxlan-mgmt"
    dstport: 4789
    mtu: 1450
    learning: true
    bridge:
      name: "br-mgmt"
      ipv4: "10.200.1.1/24"
      tags: ["mgmt"]
    underlay_interface: "ens4"
    # BUM via multicast group (requires underlay multicast support)
    bum:
      mode: "multicast"
      group: "239.1.1.200"  # Convention: 239.1.1.<vni % 256>
    routing:
      export:
        networks:
          - "10.200.0.0/24"
        metric: 200
      import:
        accept_all: true
        install:
          table: 200
          flush_on_peer_down: true
          route_lease_seconds: 60

# Route injection into VMs (multicast channel on each tagged bridge).
# The controller publishes signed advertisements; nnet-agent inside the VMs
# consumes them and programs routes. See docs/inject.md.
routing:
  inject:
    enabled: false                # set to true after distributing the PSK
    port: 4790                    # default
    interval_seconds: 10
    lease_seconds: 30
    psk_ref: "file:/etc/n-netman/psk/inject.key"
    key_id: "k1"
    rules:
      # AND semantics: the bridge must carry every tag listed here.
      - match_tags: ["it"]
        from_rib: true            # advertise routes learned from peers
        route_tags: ["it"]        # ...filtered by community; omit for all
        networks:
          - "172.16.10.0/24"
        metric: 100
      - match_tags: ["it", "external"]
        default_gateway: "10.100.0.1"

# Peer configuration (v2: declared at the root). Use 'vnis' to scope a peer to
# specific overlays; omit it to have the peer participate in every overlay.
peers:
  - id: "peer-01"
    endpoint:
      address: "192.168.1.10"
    vnis: [100, 200]
    health:
      keepalive_interval_ms: 1500
      dead_after_ms: 6000

  - id: "peer-02"
    endpoint:
      address: "192.168.1.11"
    vnis: [100, 200]
    health:
      keepalive_interval_ms: 1500
      dead_after_ms: 6000

topology:
  mode: "direct-preferred"
  transit: "deny"

security:
  control_plane:
    transport: "grpc"
    listen:
      address: "0.0.0.0"
      port: 9898
    # TLS configuration for secure peer communication (mTLS)
    # Generate certificates with:
    # 1. nnet cert init-ca --output-dir /etc/n-netman/tls
    # 2. nnet cert gen-host --host $(hostname) --ip <IP> --output-dir /etc/n-netman/tls
    tls:
      enabled: false  # Set to true to enable TLS
      cert_file: "/etc/n-netman/tls/server.crt"
      key_file: "/etc/n-netman/tls/server.key"
      ca_file: "/etc/n-netman/tls/ca.crt"  # Required for mTLS

observability:
  logging:
    level: "info"
    format: "json"
  metrics:
    enabled: true
    listen:
      address: "0.0.0.0"
      port: 9109
  healthcheck:
    enabled: true
    listen:
      address: "0.0.0.0"
      port: 9110
